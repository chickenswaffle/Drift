name: desktop-app

# Builds the DRIFT desktop app installers:
#   - Windows .exe         (windows-latest)
#   - Linux .deb/.AppImage (ubuntu-22.04)
#   - macOS .dmg ×2        (macos-14 — separate native Intel + Apple Silicon
#                           builds; PyInstaller one-file sidecars can't be lipo-ed)
#
# On a published release each installer is re-uploaded under a stable,
# version-less name for the website download buttons, e.g.:
#   /releases/latest/download/DRIFT-Setup-Windows-x64.exe
#   /releases/latest/download/DRIFT-macOS-AppleSilicon.dmg
#   /releases/latest/download/DRIFT-macOS-Intel.dmg
#
# Auto-update: every build also emits a signed updater artifact (.sig); the
# `manifest` job assembles them into a `latest.json` the in-app updater reads.
# Signing uses the TAURI_SIGNING_PRIVATE_KEY/_PASSWORD repo secrets.

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ---- Windows + Linux (native, single-arch) -------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            stable_name: DRIFT-Setup-Windows-x64.exe
            bundle_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            updater_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip
            updater_stable: DRIFT-update-windows-x86_64.nsis.zip
            platform_key: windows-x86_64
          - os: ubuntu-22.04
            label: linux
            updater_glob: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            updater_stable: DRIFT-update-linux-x86_64.AppImage.tar.gz
            platform_key: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}

      - name: Install DRIFT + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Freeze the sidecar binary
        run: python apps/desktop/sidecar/build_sidecar.py

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: npm ci || npm install

      - name: Build the app (bundles the frozen sidecar)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.conf.release.json
          releaseId: ${{ github.event.release.id }}
          # the `manifest` job builds the authoritative latest.json from all
          # platforms — don't let each matrix job upload a partial one.
          includeUpdaterJson: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drift-desktop-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Publish stable-named installer
        if: matrix.stable_name != '' && github.event_name == 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset=$(ls ${{ matrix.bundle_glob }} | head -1)
          cp "$asset" "${{ matrix.stable_name }}"
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ matrix.stable_name }}" --clobber

      - name: Stage updater artifact + signature
        if: matrix.platform_key != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          art=$(ls ${{ matrix.updater_glob }} | head -1)
          echo "updater artifact: $art"
          mkdir -p sigs
          tr -d '\n' < "$art.sig" > "sigs/${{ matrix.platform_key }}.sig"
          if [ "${{ github.event_name }}" = "release" ]; then
            cp "$art" "${{ matrix.updater_stable }}"
            gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.updater_stable }}" --clobber
          fi

      - name: Upload signature for the manifest job
        if: matrix.platform_key != ''
        uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.label }}
          path: sigs/*.sig
          if-no-files-found: error

  # ---- macOS (separate native Intel + Apple Silicon builds) ----------------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust + both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Ensure Rosetta 2 (to run the x86_64 Python)
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Freeze arm64 sidecar (native)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          TARGET_TRIPLE=aarch64-apple-darwin python apps/desktop/sidecar/build_sidecar.py

      - name: Install uv (to provision an x86_64 interpreter)
        uses: astral-sh/setup-uv@v5

      - name: Freeze x86_64 sidecar (real x86_64 Python under Rosetta)
        run: |
          # uv provisions a genuine x86_64 python-build-standalone interpreter, but
          # its resolver mis-tags x86_64-on-arm and tries to build deps from source
          # (astral-sh/uv#17851). So provision with uv, then install with *plain
          # pip* (--seed gives the venv a pip), which reads the real interpreter
          # tags and pulls the prebuilt x86_64 wheels.
          uv python install cpython-3.11-macos-x86_64-none
          uv venv --seed --python cpython-3.11-macos-x86_64-none /tmp/venv-x86
          got=$(/tmp/venv-x86/bin/python -c "import platform; print(platform.machine())")
          echo "x86 venv arch: $got"
          [ "$got" = "x86_64" ] || { echo "::error::venv is $got, expected x86_64"; exit 1; }
          # cryptography & pynacl ship universal2-only macOS wheels that the x86_64
          # standalone interpreter won't auto-match, so pip tries to source-build
          # cryptography (needs OpenSSL, fails). Install those two explicitly by
          # platform — the universal2 wheel carries the x86_64 slice PyInstaller
          # thins out — then let everything else resolve to its native x86_64 wheel
          # (already-satisfied crypto deps won't be source-built).
          export SYSTEM_VERSION_COMPAT=0
          SITE=$(/tmp/venv-x86/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "x86 site-packages: $SITE"
          /tmp/venv-x86/bin/python -m pip install --upgrade pip
          # --no-deps: only fetch these two universal2 abi3 wheels; their deps
          # (notably cffi, which is not abi3) are installed natively in the next step.
          /tmp/venv-x86/bin/python -m pip install --only-binary=:all: --no-deps \
            --platform macosx_10_12_universal2 --implementation cp \
            --python-version 3.11 --abi abi3 --target "$SITE" --upgrade \
            cryptography PyNaCl
          test -f "$SITE/cryptography/hazmat/bindings/_rust.abi3.so" \
            || { echo "::error::universal2 cryptography wheel did not install"; exit 1; }
          lipo -info "$SITE/cryptography/hazmat/bindings/_rust.abi3.so" || true
          /tmp/venv-x86/bin/python -m pip install -e . pyinstaller
          TARGET_TRIPLE=x86_64-apple-darwin \
            /tmp/venv-x86/bin/python apps/desktop/sidecar/build_sidecar.py
          got2=$(file -b apps/desktop/src-tauri/binaries/drift-sidecar-x86_64-apple-darwin)
          echo "x86 sidecar: $got2"
          echo "$got2" | grep -q "x86_64" || { echo "::error::sidecar slice is not x86_64"; exit 1; }

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: npm ci || npm install

      # Two native single-arch apps. PyInstaller --onefile binaries CANNOT be
      # lipo-ed: the Python runtime archive is appended after the Mach-O, so a
      # fused "universal" sidecar keeps only one arch's archive and the other arch
      # loads the wrong-arch Python and dies (Broken pipe). Each dmg therefore
      # bundles its own matching-arch sidecar via per-target builds.
      - name: Build Apple Silicon app (arm64)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target aarch64-apple-darwin --config src-tauri/tauri.conf.release.json

      - name: Build Intel app (x86_64)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target x86_64-apple-darwin --config src-tauri/tauri.conf.release.json

      - name: Upload dmgs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drift-desktop-macos
          path: apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Publish stable-named dmgs
        if: github.event_name == 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          arm=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin -path '*/release/bundle/dmg/*.dmg' | head -1)
          intel=$(find apps/desktop/src-tauri/target/x86_64-apple-darwin -path '*/release/bundle/dmg/*.dmg' | head -1)
          echo "arm:   $arm"
          echo "intel: $intel"
          cp "$arm" DRIFT-macOS-AppleSilicon.dmg
          cp "$intel" DRIFT-macOS-Intel.dmg
          gh release upload "${{ github.event.release.tag_name }}" \
            DRIFT-macOS-AppleSilicon.dmg DRIFT-macOS-Intel.dmg --clobber

      - name: Stage macOS updater artifacts + signatures
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          arm=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin -path '*/macos/*.app.tar.gz' | head -1)
          intel=$(find apps/desktop/src-tauri/target/x86_64-apple-darwin -path '*/macos/*.app.tar.gz' | head -1)
          echo "arm updater:   $arm"
          echo "intel updater: $intel"
          mkdir -p sigs
          tr -d '\n' < "$arm.sig"   > sigs/darwin-aarch64.sig
          tr -d '\n' < "$intel.sig" > sigs/darwin-x86_64.sig
          if [ "${{ github.event_name }}" = "release" ]; then
            cp "$arm"   DRIFT-update-darwin-aarch64.app.tar.gz
            cp "$intel" DRIFT-update-darwin-x86_64.app.tar.gz
            gh release upload "${{ github.event.release.tag_name }}" \
              DRIFT-update-darwin-aarch64.app.tar.gz DRIFT-update-darwin-x86_64.app.tar.gz --clobber
          fi

      - name: Upload macOS signatures for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: sig-macos
          path: sigs/*.sig
          if-no-files-found: error

  # ---- assemble the updater manifest from every platform's signature -------
  manifest:
    needs: [build, macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all signatures
        uses: actions/download-artifact@v4
        with:
          pattern: sig-*
          path: sigs
          merge-multiple: true

      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          sig() { cat "sigs/$1.sig"; }
          cat > latest.json <<EOF
          {
            "version": "$VER",
            "notes": "DRIFT $TAG — see the release page for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "$(sig darwin-aarch64)", "url": "$BASE/DRIFT-update-darwin-aarch64.app.tar.gz" },
              "darwin-x86_64":  { "signature": "$(sig darwin-x86_64)",  "url": "$BASE/DRIFT-update-darwin-x86_64.app.tar.gz" },
              "windows-x86_64": { "signature": "$(sig windows-x86_64)", "url": "$BASE/DRIFT-update-windows-x86_64.nsis.zip" },
              "linux-x86_64":   { "signature": "$(sig linux-x86_64)",   "url": "$BASE/DRIFT-update-linux-x86_64.AppImage.tar.gz" }
            }
          }
          EOF
          echo "=== latest.json ===" ; cat latest.json
          python3 -c "import json; json.load(open('latest.json')); print('valid json')"
          gh release upload "$TAG" latest.json --clobber -R "${{ github.repository }}"
