name: desktop-app

# Builds the DRIFT desktop app installers (Windows .exe, macOS .dmg, Linux
# .deb/.AppImage) on each OS's native runner — Windows binaries cannot be
# cross-compiled from macOS/Linux, so this is the only path to a real installer.
#
# On a published GitHub release the installers are attached to it, and the
# Windows installer is *also* uploaded under a stable name
# (DRIFT-Setup-Windows-x64.exe) so the website's download button can point at a
# permanent URL:
#   https://github.com/<owner>/<repo>/releases/latest/download/DRIFT-Setup-Windows-x64.exe

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}

      - name: Install DRIFT + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Freeze the sidecar binary
        run: python apps/desktop/sidecar/build_sidecar.py

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: npm ci || npm install

      - name: Build the app (bundles the frozen sidecar)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.conf.release.json
          # On a release event, attach the versioned installers to it.
          releaseId: ${{ github.event.release.id }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drift-desktop-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Publish stable-named Windows installer
        if: matrix.label == 'windows' && github.event_name == 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" DRIFT-Setup-Windows-x64.exe
          gh release upload "${{ github.event.release.tag_name }}" \
            DRIFT-Setup-Windows-x64.exe --clobber
