name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # DCO: every PR commit must carry Signed-off-by (CONTRIBUTING.md — "Sign
  # your work"). Keeps licensing provenance clean; no third-party action.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha lacks a Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit "$missing"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check drift/ relay/ tests/

      - name: Run type checker (mypy)
        run: mypy drift/

      - name: Run tests
        run: pytest tests/unit/ -v --tb=short --cov=drift --cov-report=term-missing

  # The gauntlet: 10 red-team probes fired at the core privacy/crypto
  # invariants (relay blindness, stealth unlinkability, forward secrecy, burn
  # replay, sealed-sender opacity, WITNESS chain integrity, forged-message
  # rejection, panic isolation, OTPK consumption, FMD rate). A unit suite can
  # pass while an invariant regresses — this job exists so it can't do so
  # silently.
  gauntlet:
    name: Adversarial gauntlet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run the gauntlet
        run: python scripts/gauntlet.py

  # Supply-chain audit: known-vulnerable dependency versions fail the build.
  # The crypto is only as trustworthy as the libraries it composes (the iron
  # rule cuts both ways).
  dep-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pip-audit
        run: |
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Audit installed dependencies
        run: pip-audit --skip-editable

  # drift-core: the shared Rust implementation (Phase 13a). It must reproduce
  # the same tests/vectors the Python reference exports — the cross-impl parity
  # gate in docs/app-plan.md §6. Runs on the same vectors committed to the repo.
  rust-core:
    name: drift-core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drift-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Vector conformance tests
        run: cargo test --all

      - name: Audit Rust dependencies (RustSec)
        run: |
          cargo install cargo-audit --locked
          cargo audit
