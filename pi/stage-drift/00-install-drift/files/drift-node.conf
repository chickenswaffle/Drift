# ─── DRIFT mesh node configuration ──────────────────────────────────────────
#
# Edit this file on the SD card's BOOT partition before first power-on (it shows
# up as a small drive on any computer after you flash the image). Everything
# here is optional: with no edits the node still boots, publishes a Tor onion
# address, and waits for peers. Lines starting with # are ignored.
#
# This file is read once, on first boot, then applied automatically.
# ─────────────────────────────────────────────────────────────────────────────

# Bootstrap peer(s) to join the mesh — comma-separated relay / onion URLs.
# Ask whoever runs a relay you trust for one, e.g.:
#DRIFT_PEERS=ws://abc123def456ghi789jkl012mno345pqr678stu901vwx234yz.onion

# Local port the node listens on (mapped to the onion's virtual port 80).
#DRIFT_NODE_PORT=8765

# Optional Wi-Fi (WPA2-PSK). Leave commented to use Ethernet, or to use a
# network you already configured with Raspberry Pi Imager.
#WIFI_SSID=your-network-name
#WIFI_PSK=your-network-password
