[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-messenger"
version = "0.5.0"
description = "Terminal-first E2E encrypted messenger with rotating stealth addresses"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["encryption", "messaging", "privacy", "cli", "e2e"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "cryptography>=42.0",
    "PyNaCl>=1.5",
    "websockets>=12.0",
    "textual>=0.50",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
relay = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
]
qr = [
    "segno>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "drift-messenger[relay,qr]",
]

[project.scripts]
drift = "drift.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["drift*", "relay*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
