[package]
name = "drift-crypto"
version = "0.1.0"
edition = "2021"
description = "DRIFT-P/1 cryptography — the Rust port of the Python reference (drift.crypto)"
license = "MIT"

[dependencies]
# Iron rule: compose vetted crates, never hand-roll a primitive.
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"          # XChaCha20-Poly1305 (24-byte nonce, IETF)
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"                     # Argon2id — the panic-vault KDF
subtle = "2"                       # constant-time comparison
rand_core = "0.6"                  # OsRng for production keypair/nonce generation

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
