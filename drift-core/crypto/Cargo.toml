[package]
name = "drift-crypto"
version = "0.1.0"
edition = "2021"
description = "DRIFT-P/1 cryptography — the Rust port of the Python reference (drift.crypto)"
license = "MIT"

[dependencies]
# Iron rule: compose vetted crates, never hand-roll a primitive.
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"          # XChaCha20-Poly1305 (24-byte nonce, IETF)
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"                     # Argon2id — the panic-vault KDF
subtle = "2"                       # constant-time comparison
rand_core = "0.6"                  # OsRng for production keypair/nonce generation
zeroize = { version = "1", features = ["derive"] }  # wipe secrets on drop / after use
# libsodium's ed25519 group ops (Elligator `from_uniform`, point add, scalar
# arithmetic) for stealth addressing + FMD. Binding the *same* library the
# Python reference uses is what makes those constructions byte-identical — there
# is no bit-exact pure-Rust equivalent of `crypto_core_ed25519_from_uniform`.
# The `-stable` crate vendors and builds libsodium from source (no system dep).
libsodium-sys-stable = "1.22"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
